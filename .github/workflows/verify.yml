name: verify

# Everything in this repo is generated by the source repo's release pipeline.
# These are the failures that generation can produce silently: a manifest left
# on the previous version, the two skill copies drifting, a manifest pointing
# somewhere other than ./skills/ (which registers the skill twice), or a
# staging URL in a public manifest. The .skill bundle smoke test lives in
# release.yml — this job never downloads anything.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests and skill copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Verify
        env:
          # Empty on push/PR — the script then checks internal consistency only.
          TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/verify-manifests.mjs $TAG
