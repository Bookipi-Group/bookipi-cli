# Lists the hosted connector (mcp.bookipi.com/mcp) in the official MCP Registry,
# registry.modelcontextprotocol.io, which many MCP clients and directories copy.
#
# server.json is generated: the source repo's release pipeline writes it here
# with the release's version stamped in, then publishes the release, which runs
# this. The registry refuses a version it already has, so a re-run of the same
# release fails harmlessly. Run it by hand to publish what is on main.
#
# GitHub Actions OIDC proves the io.github.Bookipi-Group/ namespace: no secret.

name: publish-mcp

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish server.json to the MCP Registry
    runs-on: ubuntu-latest
    env:
      # Upgrade deliberately; the bundle check below is tied to this tag.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Sign in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

      - name: Confirm the listing
        run: |
          VERSION=$(jq -r .version server.json)
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.Bookipi-Group" \
            | jq -e --arg v "$VERSION" '[.servers[].server.version] | index($v)'
